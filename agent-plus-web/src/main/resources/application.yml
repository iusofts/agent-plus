###global config###
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.freemarker.FreeMarkerAutoConfiguration
  profiles:
    active: @profile@
  application:
    name: agent-plus
  http:
    multipart:
      maxFileSize: 50Mb
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      password: 
  datasource:
    dynamic:
      primary: biz #设置默认的数据源或者数据源组,默认值即为biz
      strict: false #设置严格模式,默认false不启动. 启动后在未匹配到指定数据源时候会抛出异常,不启动则使用默认数据源.
      datasource:
        biz:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://127.0.0.1:3306/agent-plus?zeroDateTimeBehavior=convertToNull&useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=GMT%2B8
          username: root
          password: 123456
          hikari:
            max-lifetime: 60000
        sys:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://127.0.0.1:3306/agent-plus-sys?zeroDateTimeBehavior=convertToNull&useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=GMT%2B8
          username: root
          password: 123456
          hikari:
            max-lifetime: 60000


mybatis-plus:
  mapper-locations: classpath*:com/iusofts/agentplus/**/*Mapper.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none
  api-docs:
    path: /v3/api-docs
    enabled: true

logging:
  level:
    ROOT: info
    com.iusofts.ai.mapper: info

server:
  servlet:
    contextPath: 
  port: 8080
  
  
storage:
  oss:
    accessKeyId: XXX
    accessKeySecret: XXX
    endPoint: XXX
    regionId: XXX
    roleArn: XXX
    bucket: iusofts
    domain: https://iusofts.oss-cn-hangzhou.aliyuncs.com
    

# 阿里云通义千问官方SDK配置
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus

# 豆包（火山引擎）配置
doubao:
  api-key: ${DOUBAO_API_KEY:}
  base-url: https://ark.cn-beijing.volces.com/api/v3
  model:

# 知识库(向量库/分块/异步管线)配置。向量库复用 spring.data.redis 连接。
knowledge:
  # 向量维度,需与 embedding 模型输出一致(千问 text-embedding-v3 = 1024)
  dimension: 1024
  # RedisEmbeddingStore 索引名前缀,实际索引名 = prefix + collectionName
  index-prefix: "kb:"
  # 文档处理线程池
  ingest:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 200
    keep-alive-seconds: 60
  # 单个文档处理最长时长(秒),超过则视为处理中超时,定时任务重新入队
  process-timeout-seconds: 600

---

spring:
  config:
    activate:
      on-profile: default

